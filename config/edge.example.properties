# Copy outside the repository as edge.properties; chmod 600.
server=https://radio.example.org
bus.id=bus-001
bus.token=REPLACE_WITH_THE_DEVICE_TOKEN_FROM_ADMIN
server.publicKey=REPLACE_WITH_THE_PINNED_ED25519_PUBLIC_KEY_FROM_ADMIN
cache.dir=/var/lib/busradio-edge
cache.maxBytes=4294967296
sync.zone=Europe/Moscow
sync.start=01:00
sync.end=05:00
sync.demoLoopback=false
wifi.interface=wlan0
wifi.ssids=DEPOT_WIFI|MAINTENANCE_WIFI
# Configure Wi-Fi credentials in NetworkManager, not here.
gps.mode=gpsd
gpsd.host=127.0.0.1
gpsd.port=2947
# Alternative: fresh normalized buscrawl JSONL already available locally.
# gps.mode=buscrawl
# gps.buscrawlFile=/var/lib/buscrawl/vehicle.jsonl
# gps.vehicle=EXACT_PLATE_OR_NAVI_UNIT_ID
hardware.enabled=false
hardware.ignitionBcm=17
hardware.ledBcm=27
# null: no sound; wav: aircheck file; alsa: aplay; fm: external native backend.
audio.mode=null
audio.realtime=true
audio.file=/var/lib/busradio-edge/aircheck.wav
alsa.executable=/usr/bin/aplay
rf.enabled=false
rf.authorization=
rf.frequencyMHz=
rf.executable=/usr/local/bin/fm_transmitter
