# Java 21 / Raspberry Pi 3, 4 or Zero 2 (64-bit OS for this deployment).
# Build: mvn -Ppi clean verify
server.url=https://radio.example.invalid
node.id=bus-001
# Set BUSRADIO_NODE_TOKEN in a protected environment file; never commit the token.
node.data=var/node
cache.maxMiB=4096
timezone=Europe/Moscow
sync.start=01:00
sync.end=05:00
sync.requireWifi=true
sync.interface=wlan0
sync.ssids=BusDepot-WiFi
sync.requireParked=true
sync.pollSeconds=30
sync.jitterSeconds=15
position.mode=gpsd
gpsd.host=127.0.0.1
gpsd.port=2947
io.mode=pi4j
gpio.ignition=17
gpio.mute=22
gpio.led=27
# SAFE DEFAULT: creates bounded WAV captures; does NOT generate radiofrequency.
audio.mode=wav
playback.speed=1
rf.enabled=false
rf.authorization=
rf.frequency=
rf.executable=/usr/local/bin/pi_fm_rds
transport.allowHttp=false

# Optional narrow root-owned helper, see docs/OPERATIONS.md.
rf.useSudoHelper=false
